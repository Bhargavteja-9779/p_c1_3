name: batscreen
channels: [conda-forge]
dependencies:
  - python=3.13
  - numpy=2.5.3
  - scipy=1.18.1
  - pandas=3.0.5
  - scikit-learn=1.9.1
  - h5py=3.16.0
  - pyyaml=6.0.3
  - joblib=1.6.0
  - matplotlib=3.11.2
  - tabulate=0.10.0
  - pytest=9.1.1
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.15.0
      - python-docx==1.2.0
